services:
  mongodb:
    image: mongo:8
    container_name: ecommerce-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8
    container_name: ecommerce-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongodb_data: